<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sump</title>
<style>
  /*
   * This page is loaded through Home Assistant's ingress feature,
   * which embeds it in an iframe -- a genuinely separate document
   * from the main Home Assistant frontend. CSS custom properties
   * don't cross that boundary, so unlike the entities/history this
   * project also creates, this page can't automatically match
   * whatever HA theme you're running. Instead it has its own
   * deliberate look: a dark, glass-lit-in-a-dark-room palette (how a
   * lot of reef tanks actually get viewed), with a light variant for
   * anyone who prefers it.
   */
  :root {
    --bg: #0a1418;
    --surface: #0f1e24;
    --text: #e8f1f2;
    --text-secondary: #7a9499;
    --accent: #2dd4bf;
    --divider: #1a2c32;
    --error: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4fbfb;
      --surface: #ffffff;
      --text: #0a1418;
      --text-secondary: #547278;
      --accent: #0d9488;
      --divider: #dceef0;
      --error: #dc2626;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 24px 24px 12px;
    border-bottom: 1px solid var(--divider);
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 4px 0 0;
    color: var(--text-secondary);
    font-size: 13px;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px 24px 64px;
  }
  section.device { margin-top: 28px; }
  .device-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }
  .device-header h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    margin: 0;
  }
  .badge-offline { font-size: 12px; color: var(--error); }
  .readings {
    display: flex;
    flex-wrap: wrap;
    border-top: 1px solid var(--divider);
  }
  .reading {
    flex: 1 1 130px;
    padding: 18px 20px 18px 0;
    border-bottom: 1px solid var(--divider);
  }
  .reading-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .reading-value {
    font-variant-numeric: tabular-nums;
    font-size: 32px;
    font-weight: 300;
    color: var(--accent);
    line-height: 1;
  }
  .reading-unit {
    font-size: 13px;
    color: var(--text-secondary);
    margin-left: 6px;
  }
  .outputs { margin-top: 4px; }
  .output-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--divider);
    font-size: 14px;
  }
  .output-state {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--divider);
    color: var(--text-secondary);
  }
  .state { padding: 48px 16px; text-align: center; color: var(--text-secondary); }
  .state.error { color: var(--error); }
</style>
</head>
<body>
  <header>
    <h1>Sump</h1>
    <p id="tank-count">Loading tank data&hellip;</p>
  </header>
  <main id="content"></main>

  <script>
    const POLL_INTERVAL_MS = 10000;

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        if (data.error) {
          render(null, data.error);
        } else {
          render(data.devices || [], null);
        }
      } catch (err) {
        render(null, 'Could not reach the Sump app backend.');
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatValue(value) {
      if (typeof value === 'number') {
        // Round to at most 2 decimals without padding whole numbers.
        return String(Math.round(value * 100) / 100);
      }
      return escapeHtml(value === undefined || value === null || value === '' ? '—' : String(value));
    }

    function renderDevice(device) {
      const readings = (device.probes || []).map((p) => `
        <div class="reading">
          <div class="reading-label">${escapeHtml(p.name)}</div>
          <div><span class="reading-value">${formatValue(p.value)}</span><span class="reading-unit">${escapeHtml(p.unit || '')}</span></div>
        </div>
      `).join('');

      const outputs = (device.outputs || []).map((o) => `
        <div class="output-row">
          <span>${escapeHtml(o.name)}</span>
          <span class="output-state">${escapeHtml(o.state || '?')}</span>
        </div>
      `).join('');

      return `
        <section class="device">
          <div class="device-header">
            <h2>${escapeHtml(device.name)}</h2>
            ${!device.available ? '<span class="badge-offline">Not responding</span>' : ''}
          </div>
          <div class="readings">${readings || '<div class="state">No probes reported yet.</div>'}</div>
          ${outputs ? `<div class="outputs">${outputs}</div>` : ''}
        </section>
      `;
    }

    function render(devices, error) {
      const countEl = document.getElementById('tank-count');
      const contentEl = document.getElementById('content');

      if (error) {
        countEl.textContent = 'Connection problem';
        contentEl.innerHTML = `<div class="state error">${escapeHtml(error)}</div>`;
        return;
      }
      if (devices === null) {
        countEl.textContent = 'Loading tank data\u2026';
        return;
      }
      countEl.textContent = `${devices.length} tank${devices.length === 1 ? '' : 's'}`;
      if (devices.length === 0) {
        contentEl.innerHTML = '<div class="state">No aquarium devices yet. Add one from Settings &rarr; Devices &amp; services &rarr; Add integration &rarr; Sump.</div>';
        return;
      }
      contentEl.innerHTML = devices.map(renderDevice).join('');
    }

    fetchStatus();
    setInterval(fetchStatus, POLL_INTERVAL_MS);
  </script>
</body>
</html>
